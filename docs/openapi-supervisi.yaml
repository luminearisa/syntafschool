openapi: 3.0.3
info:
  title: Syntaf School — API Modul Supervisi
  version: 1.0.0
  description: |
    API modul Supervisi (`/api/v1/supervisi`). Seluruh respons memakai envelope standar aplikasi:

    ```json
    { "success": true, "data": {}, "message": null, "meta": {} }
    ```

    Error validasi:

    ```json
    { "success": false, "message": "Data yang diberikan tidak valid", "errors": { "field": ["..."] } }
    ```

    Autentikasi: Bearer token Sanctum (`POST /api/v1/auth/login`). Setiap operasi mencantumkan
    izin Spatie yang dibutuhkan pada `x-permission` dan batas laju pada `x-rate-limit`.

    **Cakupan data.** Izin hanya menentukan layar yang boleh dibuka; baris yang boleh dilihat
    ditentukan cakupan (`DataScope`): pemegang `supervisi.visit.view.all`, `supervisi.manage`,
    `supervisi.audit.view`, `supervisi.analytics.view`, atau `supervisi.report.export` melihat seluruh
    sekolah; guru/staf hanya melihat datanya sendiri (blueprint §11.6). Sekolah dapat mengizinkan
    ringkasan agregat bagi rekan sejawat lewat pengaturan `peer_summary_enabled`.

    **Mode luring.** `GET /visits/{visit}/blank-form` mencetak formulir kertas; jawaban dari perangkat
    tanpa jaringan dikirim lewat `POST /visits/{visit}/answers/sync` (idempoten per `client_uuid`).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: action-plans
  - name: analytics
  - name: appraisals
  - name: assignments
  - name: calibration
  - name: cipp
  - name: growth
  - name: instruments
  - name: module
  - name: pip
  - name: programs
  - name: reports
  - name: schedules
  - name: supervisors
  - name: visits
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    ApiEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data: { type: object, nullable: true }
        message: { type: string, nullable: true }
        meta: { type: object, nullable: true }
    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors: { type: object, nullable: true }
    Answer:
      type: object
      required: [indicator_id]
      properties:
        indicator_id: { type: integer }
        option_id: { type: integer, nullable: true }
        value_number: { type: number, nullable: true }
        value_text: { type: string, nullable: true }
        value_long_text: { type: string, nullable: true }
        is_na: { type: boolean }
        comment: { type: string, nullable: true }
        client_uuid: { type: string, nullable: true, description: "Penanda idempoten mode luring" }
    OfflineAnswer:
      allOf:
        - $ref: "#/components/schemas/Answer"
        - type: object
          properties:
            option_code: { type: string, nullable: true, description: "Huruf pilihan pada formulir cetak (A/B/C/…), atau skor/label opsinya" }
            captured_at: { type: string, format: date-time, nullable: true, description: "Waktu perangkat merekam — dasar deteksi konflik" }
    ReportRequest:
      type: object
      required: [report_key]
      properties:
        report_key: { type: string, enum: [program_supervisi, hasil_supervisi, tindak_lanjut, analitik_indikator, rekap_penilaian, kalibrasi_penilai] }
        format: { type: string, enum: [CSV, XLSX, PDF, JSON] }
        from: { type: string, format: date }
        to: { type: string, format: date }
    CalibrationScore:
      type: object
      required: [supervisor_employee_id]
      properties:
        supervisor_employee_id: { type: integer }
        indicator_id: { type: integer, nullable: true }
        indicator_label: { type: string, nullable: true, description: "Dipakai untuk kasus bersama tanpa indikator" }
        score: { type: number }
        comment: { type: string, nullable: true }
