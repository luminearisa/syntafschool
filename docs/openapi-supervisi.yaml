    VisitCreate:
      type: object
      required: [supervisee_employee_id, instrument_version_id]
      properties:
        supervisee_employee_id: { type: integer }
        instrument_version_id: { type: integer }
        program_id: { type: integer, nullable: true }
        schedule_id: { type: integer, nullable: true }
        activity_kind: { type: string, enum: [WALKTHROUGH, CLASS_OBSERVATION, CLINICAL, PEER, SELF, DOCUMENT_REVIEW, COACHING] }
        observed_at: { type: string, format: date-time }
        lesson_topic: { type: string, nullable: true }
    AnswerBatch:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items: { $ref: "#/components/schemas/Answer" }
    OfflineAnswerBatch:
      type: object
      required: [answers]
      properties:
        device: { type: string, nullable: true }
        answers:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/OfflineAnswer" }
    FindingBatch:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          items:
            type: object
            properties:
              component: { type: string }
              priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
              weakness: { type: string }
              cause: { type: string, nullable: true }
              recommendation: { type: string, nullable: true }
    ConferencePayload:
      type: object
      properties:
        held_at: { type: string, format: date-time }
        agreements: { type: array, items: { type: string } }
        reflection: { type: string, nullable: true }
    FinalizePayload:
      type: object
      properties:
        summary: { type: string, nullable: true }
        strengths: { type: string, nullable: true }
        improvements: { type: string, nullable: true }
    ReopenPayload:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 10 } }
    DisputePayload:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        expected: { type: string, nullable: true }
    CalibrationCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        threshold: { type: number, description: "Selisih maks-min yang disepakati" }
        held_at: { type: string, format: date-time }
