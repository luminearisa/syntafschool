openapi: 3.0.3
info:
  title: Syntaf School — LMS API
  version: 1.0.0
  description: |
    API modul LMS (`/api/v1/lms`). Seluruh respons memakai envelope yang sama:

    ```json
    { "success": true, "data": {}, "message": null, "meta": {} }
    ```

    Error:

    ```json
    { "success": false, "message": "Validation failed", "errors": {} }
    ```

    Autentikasi: Bearer token Sanctum dari `POST /api/v1/lms/auth/login`.
    Rute bertanda *Publik* dapat dipanggil tanpa token.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    ApiEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data: { type: object, nullable: true }
        message: { type: string, nullable: true }
        meta: { type: object, nullable: true }
    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Validation failed }
        errors: { type: object, nullable: true }
    HealthSummary:
      type: object
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED, UNAVAILABLE] }
        status_label: { type: string }
        checked_at: { type: string, format: date-time }
        learning_available: { type: boolean }
